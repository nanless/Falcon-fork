# LRS2-2Mix 论文 Table 16 配方（v2，2026-10-30）
#
# 论文依据：Falcon (arXiv:2610.32749) §5.2 + App D Table 16：
#   - 重建损失 L_recon = -SI-SNR（不是 -SNR）           -> loss.train.sdr_type: pairwise_neg_sisdr
#   - 对比温度 tau（代码里叫 beta）0->1 线性退火，前 1000 epoch，之后固定 1
#                                                        -> spk_contrast.beta_anneal_epochs: 1000
#   - batch 4 / GPU，8xRTX3090 => global batch 32       -> datamodule.data_config.batch_size: 4
#   - AdamW lr 1e-3 / wd 0.01、ReduceLROnPlateau(15, 0.5)、grad clip 5
#   - max epochs 1000，EarlyStopping(monitor=val_loss, patience=30)
#   - seed 42（论文 §5.2；必须重跑才能确认方差）        -> training.seed: 42
#
# 与 LEGACY 配置的区别（configs/LRS2_2Mix_Paper_8gpu.yml 保留不删）：
#   legacy: -SNR + beta/200 + bs5/GPU (global 40)；v2: -SI-SDR + beta/1000 + bs4/GPU (global 32)
#
# 启动：bash tools/repro/phase2/run_lrs2_paper_volcano_8gpu.sh（默认 CONF 指向本文件；
#       DATA_ROOT 会被渲染进临时 conf 的三处 data dir）

videonet:
  videonet_name: FRCNNVideoModel
  videonet_config:
    backbone_type: resnet
    relu_type: prelu
    width_mult: 1.0
    pretrain: /root/.cache/falcon_weights/frcnn_128_512.backbone.pth.tar
audionet:
  audionet_name: FalconSpeakerContrastive
  audionet_config:
    n_src: 1
    pretrained_vout_chan: 512
    causal: true
    spk_embed_dim: 64
    video_bn_params:
      kernel_size: -1
    audio_bn_params:
      pre_norm_type: cLNhw
      pre_act_type: ReLU
      out_chan: 112
      kernel_size: 1
      is2d: true
    enc_dec_params:
      win: 256
      hop_length: 128
      out_chan: 112
      kernel_size: 3
      stride: 1
      bias: false
      act_type: null
      norm_type: null
      causal: true
    audio_params:
      n_freqs: 129
      hid_chan: 64
      kernel_size: 5
      stride: 2
      norm_type: cLNhw
      act_type: PReLU
      upsampling_depth: 4
      repeats: 2
      shared: true
      is2d: true
      layers:
        layer_1:
          hid_chan: 24
          dim: 4
          kernel_size: 8
          stride: 1
          rnn_type: LSTM
          num_layers: 1
          bidirectional: true
        layer_2:
          hid_chan: 72
          dim: 3
          kernel_size: 8
          stride: 1
          rnn_type: LSTM
          num_layers: 1
          bidirectional: false
        layer_3:
          dim: 3
          n_head: 4
          hid_chan: 4
          act_type: PReLU
          norm_type: LayerNormalization4D
          causal: true
    video_params:
      hid_chan: 32
      kernel_size: 3
      stride: 2
      norm_type: BatchNorm1d
      act_type: PReLU
      repeats: 1
      shared: true
      is2d: false
      layers:
        layer_1:
          kernel_size: 3
          n_head: 8
          dropout: 0.1
          norm_type: cLN
          causal: true
    fusion_params:
      fusion_type: NeuroSCNetFusion
      fusion_shared: true
      kernel_size: 4
      is2d: true
    mask_generation_params:
      mask_generator_type: MaskGenerator
      mask_act: ReLU
      RI_split: true
      is2d: true
spk_contrast:
  margin: 0.5
  alpha_pos: 1.0
  alpha_neg: 1.0
  beta_init: 0.0
  beta_final: 1.0
  beta_anneal_epochs: 1000
  loss_weight: 1.0
loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      # -SI-SNR 是逐对均值，不做 30 dB 截断（与 val 的 pairwise_neg_sisdr 一致）
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
training:
  system: AudioVisualLightningModuleNASSv2
  gpus: -1
  parallel: ddp
  epochs: 1000
  early_stop:
    monitor: val_loss/dataloader_idx_0
    mode: min
    patience: 30
    verbose: true
  logger: csv
  accumulate_grad_batches: 1
  seed: 42
optimizer:
  optim_name: adamw
  lr: 0.001
  weight_decay: 0.01
scheduler:
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 15
    factor: 0.5
datamodule:
  data_name: AVSpeechDataModuleWithNear
  data_config:
    train_dir: /root/data/falcon_lrs2_2mix_paper/tr
    valid_dir: /root/data/falcon_lrs2_2mix_paper/cv
    test_dir: /root/data/falcon_lrs2_2mix_paper/tt
    n_src: 1
    sample_rate: 16000
    segment: 2.0
    normalize_audio: false
    batch_size: 4
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    use_near: true
    train_samples: 10000
exp:
  exp_name: LRS2_2Mix_Paper_v2
