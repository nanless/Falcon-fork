# RealSSA-Sim 双 A800 训练；路径以服务器上的实际文件为准。
# 120 ms 块：16 kHz 音频 1920 点、25 fps 视频 3 帧。
# 使用 2 秒训练片段，末块补齐至 2.04 秒，仅对真实 2 秒计算损失。
tar_index: /root/group-shared/voiceprint/experiments/falcon_realssa_trial_20261111/index/full-S1xPSK/tr.json
valid_tar_index: /root/group-shared/voiceprint/experiments/falcon_realssa_trial_20261111/index/full-S1xPSK/cv.json
visual_init: /root/.cache/falcon_weights/frcnn_128_512.backbone.pth.tar
# 发布数据缺少各干扰人的独立近场波形，因此只使用对比正项。
positive_contrastive: true
contrastive_weight: 1.0
model_channels: 320
batch_size: 1024
accum: 1
# 300 为最大轮数；以验证集早停，达到上限不自动视为收敛。
epochs: 300
max_steps: 0
# 按实际验证曲线检查学习率；不对 batch 进行简单线性放大。
lr: 0.001
warmup_steps: 100
weight_decay: 0.01
lr_patience: 5
early_stop_patience: 25
min_delta: 0.01
# 验证全部 cv 样本，双卡按索引分片、分批读取并按样本数加权。
validation_limit: 0
validation_batch_size: 64
workers: 4
seed: 42
backend: nccl
save_every: 1
# 每次启动应覆盖为独立实验目录中的新路径。
output: /root/group-shared/voiceprint/experiments/falcon_streaming_120ms_realssa_20261111/final.pt
checkpoint_dir: /root/group-shared/voiceprint/experiments/falcon_streaming_120ms_realssa_20261111/epochs
