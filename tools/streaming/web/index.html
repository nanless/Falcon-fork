<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falcon 160 ms 流式测试</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>Falcon 160 ms 音视频流式测试</h1><p>使用摄像头和麦克风，按 160 ms 分块发送。请戴耳机，避免扬声器回授。</p><div class="controls"><button id="start">开始采集</button><button id="stop" disabled>停止</button><label><input type="checkbox" id="monitor"> 播放模型输出</label></div><video id="camera" muted playsinline autoplay></video><p id="tracking">嘴部跟踪：未启动</p><p id="status" role="status">尚未启动。</p><p id="metrics">当前未测得延迟。</p><p>模型输出质量取决于训练；状态显示为随机初始化时，本页面仅用于检查实时链路。显示延迟采用浏览器音频时钟估算，设备实际采集和声卡输出延迟需要单独测量。</p></main><script type="module" src="./app.mjs"></script></body></html>
