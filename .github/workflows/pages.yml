# Publishes project_page/ to GitHub Pages (https://cslikai.cn/Falcon/).
# Demo audio and video are served from https://oss.cslikai.cn/demos/, not from this repository.
name: Project page

on:
  push:
    branches: [main]
    paths: ["project_page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The page goes live only once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages 未启用时 configure-pages 会以 HttpError: Not Found 失败。先探测一次，
      # 未启用就跳过部署并给出开启方式（Settings → Pages → Source: GitHub Actions），
      # 以免每次改项目页都留下一个无法自解释的红叉。
      - id: pages
        name: Probe GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 未启用::Settings → Pages → Source 选 GitHub Actions 后本作业才会部署项目页。"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: project_page
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
